<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c99b5"/></marker></defs><rect width="760" height="440" rx="16" fill="#f6faff"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="28" y="40" font-size="23" fill="#183b61" text-anchor="start">声学量之间的关系</text><text x="28" y="65" font-size="12" fill="#7a90a6" text-anchor="start">以平面行波为例；一般复声场须考虑声压与速度的相位关系。</text><rect x="35" y="155" width="185" height="76" rx="12" fill="#2f83cd10" stroke="#2f83cd"/><text x="127.5" y="184" font-size="17" fill="#2f83cd" text-anchor="middle">声压 p</text><text x="127.5" y="208" font-size="12" fill="#637c92" text-anchor="middle">压力扰动 · Pa</text><rect x="285" y="155" width="185" height="76" rx="12" fill="#2f83cd10" stroke="#2f83cd"/><text x="377.5" y="184" font-size="17" fill="#2f83cd" text-anchor="middle">声阻抗 Z = ρc</text><text x="377.5" y="208" font-size="12" fill="#637c92" text-anchor="middle">介质性质</text><rect x="535" y="155" width="185" height="76" rx="12" fill="#2f83cd10" stroke="#2f83cd"/><text x="627.5" y="184" font-size="17" fill="#2f83cd" text-anchor="middle">声强 I</text><text x="627.5" y="208" font-size="12" fill="#637c92" text-anchor="middle">能量流率 · W/m²</text><line x1="230" y1="193" x2="272" y2="193" stroke="#b4c6d9" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="480" y1="193" x2="522" y2="193" stroke="#b4c6d9" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><text x="380" y="290" font-size="25" fill="#267dbe" text-anchor="middle">平面行波： I = pᵣₘₛ² / (ρc)</text><text x="380" y="337" font-size="14" fill="#637c92" text-anchor="middle">声压与声强换算，必须保留介质与参考约定</text><line x1="28" y1="405" x2="732" y2="405" stroke="#dfebf4" stroke-width="2" stroke-dasharray=""/><text x="28" y="425" font-size="11" fill="#879aac" text-anchor="start">课程原理示意 · 不作为求解器计算结果</text></g></svg>