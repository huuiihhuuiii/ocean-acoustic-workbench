<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c99b5"/></marker></defs><rect width="760" height="440" rx="16" fill="#f6faff"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="28" y="40" font-size="23" fill="#183b61" text-anchor="start">三类传播方法的共同出发点</text><text x="28" y="65" font-size="12" fill="#7a90a6" text-anchor="start">不同展开、近似和数值实现有各自适用条件；不能只凭模型名称判断准确性。</text><rect x="281" y="97" width="195" height="68" rx="12" fill="#688ad810" stroke="#688ad8"/><text x="378.5" y="126" font-size="17" fill="#688ad8" text-anchor="middle">Helmholtz 方程</text><text x="378.5" y="150" font-size="12" fill="#637c92" text-anchor="middle">频域传播问题</text><line x1="380" y1="172" x2="127" y2="241" stroke="#b4c6d9" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><rect x="30" y="244" width="195" height="82" rx="12" fill="#9d7bce10" stroke="#9d7bce"/><text x="127.5" y="273" font-size="17" fill="#9d7bce" text-anchor="middle">简正波</text><text x="127.5" y="297" font-size="12" fill="#637c92" text-anchor="middle">垂向模态展开</text><line x1="380" y1="172" x2="378" y2="241" stroke="#b4c6d9" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><rect x="281" y="244" width="195" height="82" rx="12" fill="#398eb810" stroke="#398eb8"/><text x="378.5" y="273" font-size="17" fill="#398eb8" text-anchor="middle">射线 / 波束</text><text x="378.5" y="297" font-size="12" fill="#637c92" text-anchor="middle">轨迹与有限宽波束</text><line x1="380" y1="172" x2="629" y2="241" stroke="#b4c6d9" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><rect x="532" y="244" width="195" height="82" rx="12" fill="#b9945210" stroke="#b99452"/><text x="629.5" y="273" font-size="17" fill="#b99452" text-anchor="middle">抛物方程</text><text x="629.5" y="297" font-size="12" fill="#637c92" text-anchor="middle">沿距离步进近似</text><text x="380" y="370" font-size="14" fill="#637c92" text-anchor="middle">环境、边界、频率与精度目标共同决定方法选择</text><line x1="28" y1="405" x2="732" y2="405" stroke="#dfebf4" stroke-width="2" stroke-dasharray=""/><text x="28" y="425" font-size="11" fill="#879aac" text-anchor="start">课程原理示意 · 不作为求解器计算结果</text></g></svg>